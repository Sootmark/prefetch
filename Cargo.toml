[package]
name = "sootmark-prefetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows Prefetch (.pf) parser, versions 17 to 31, with its own LZ77+Huffman (MS-XCA) decompression."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/prefetch"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "prefetch", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "prefetch"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
